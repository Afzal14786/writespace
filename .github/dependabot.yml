version: 2

updates:
  # npm dependencies
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: sunday
    open-pull-requests-limit: 10

    groups:
      dependencies:
        patterns:
          - "*"
        exclude-patterns:
          - "typescript"
          - "eslint*"
          - "jest*"

    labels:
      - backend
      - dependencies

  # Docker base images
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: sunday
    labels:
      - docker
      - infrastructure

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels:
      - ci/cd
      - dependencies