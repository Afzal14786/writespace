<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="920" viewBox="0 0 1440 920" role="img" aria-labelledby="title desc">
  <title id="title">Writespace shared content model</title>
  <desc id="desc">Users author content items. Each content item has Post or Article specific data and can have reactions, saves, shares, comments, and mentions. Post media belongs to Posts, and comment reactions belong to comments.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7f5ff"/><stop offset="1" stop-color="#eeebff"/></linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6d39e8"/><stop offset="1" stop-color="#3c1d9b"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#25105e" flood-opacity=".12"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#7d68bd"/></marker>
    <style>
      .heading{font:700 34px Inter,Arial,sans-serif;fill:#20134d}
      .sub{font:400 19px Inter,Arial,sans-serif;fill:#625b7f}
      .label{font:700 22px Inter,Arial,sans-serif;fill:#261858}
      .small{font:400 16px Inter,Arial,sans-serif;fill:#61597e}
      .tiny{font:600 14px Inter,Arial,sans-serif;fill:#6b6091;letter-spacing:.5px}
      .card{fill:#fff;stroke:#dcd4fb;stroke-width:2;filter:url(#shadow)}
      .line{fill:none;stroke:#8b76c9;stroke-width:3;marker-end:url(#arrow)}
      .dashed{fill:none;stroke:#9c8bd0;stroke-width:2.5;stroke-dasharray:8 8;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1440" height="920" rx="28" fill="url(#bg)"/>
  <circle cx="1285" cy="115" r="140" fill="#e5ddff" opacity=".45"/>
  <circle cx="130" cy="795" r="180" fill="#e9e3ff" opacity=".55"/>

  <text x="76" y="78" class="tiny">WRITESPACE / ARCHITECTURE</text>
  <text x="76" y="128" class="heading">Shared content identity</text>
  <text x="76" y="162" class="sub">One common reference for multiple content types and their interactions</text>

  <!-- User -->
  <rect x="535" y="205" width="370" height="86" rx="18" class="card"/>
  <circle cx="582" cy="248" r="22" fill="#eee9ff"/>
  <circle cx="582" cy="240" r="7" fill="#6540c4"/><path d="M566 263c2-12 10-17 16-17s14 5 16 17" fill="none" stroke="#6540c4" stroke-width="5" stroke-linecap="round"/>
  <text x="624" y="244" class="label">users</text>
  <text x="624" y="269" class="small">author_id</text>

  <!-- content item -->
  <path d="M720 291V345" class="line"/>
  <rect x="430" y="350" width="580" height="172" rx="24" fill="url(#purple)" filter="url(#shadow)"/>
  <rect x="456" y="376" width="66" height="66" rx="15" fill="#fff" opacity=".16"/>
  <ellipse cx="489" cy="394" rx="18" ry="7" fill="none" stroke="#fff" stroke-width="4"/>
  <path d="M471 394v30c0 5 36 5 36 0v-30M471 409c0 5 36 5 36 0" fill="none" stroke="#fff" stroke-width="4"/>
  <text x="548" y="405" font-family="Inter,Arial,sans-serif" font-size="29" font-weight="700" fill="#fff">content_items</text>
  <text x="548" y="439" font-family="Inter,Arial,sans-serif" font-size="18" fill="#e8e0ff">Shared identity + common metadata</text>
  <line x1="464" y1="462" x2="976" y2="462" stroke="#cfc2ff" stroke-opacity=".4"/>
  <text x="470" y="492" font-family="Inter,Arial,sans-serif" font-size="16" fill="#fff">id  ·  content_type  ·  author_id  ·  status  ·  publish_date  ·  counters</text>

  <!-- subtype branches -->
  <path d="M570 522V568H350V606" class="line"/>
  <path d="M870 522V568H1090V606" class="line"/>
  <rect x="130" y="610" width="440" height="145" rx="20" class="card"/>
  <rect x="164" y="644" width="66" height="66" rx="14" fill="#eee9ff"/>
  <path d="M184 660h28v34h-28zM190 668h16M190 676h16M190 684h11" fill="none" stroke="#6540c4" stroke-width="3" stroke-linecap="round"/>
  <text x="256" y="665" class="label">posts</text>
  <text x="256" y="694" class="small">Post-specific fields and rules</text>
  <text x="256" y="721" class="tiny">shared content identity</text>

  <rect x="870" y="610" width="440" height="145" rx="20" class="card"/>
  <rect x="904" y="644" width="66" height="66" rx="14" fill="#eee9ff"/>
  <path d="M924 659h27v37h-27zM930 668h15M930 676h15M930 684h15" fill="none" stroke="#6540c4" stroke-width="3" stroke-linecap="round"/>
  <text x="996" y="665" class="label">articles</text>
  <text x="996" y="694" class="small">Article-specific fields and rules</text>
  <text x="996" y="721" class="tiny">shared content identity</text>

  <!-- interaction panel -->
  <rect x="100" y="800" width="1240" height="80" rx="18" fill="#fff" stroke="#dcd4fb" stroke-width="2" filter="url(#shadow)"/>
  <text x="132" y="833" class="tiny">SHARED CONTENT REFERENCES</text>
  <text x="132" y="860" class="small">Common interactions target content_item_id, regardless of whether the item is a Post or an Article.</text>
  <g font-family="Inter,Arial,sans-serif" font-weight="700" font-size="17" fill="#3b267a">
    <rect x="760" y="817" width="112" height="43" rx="12" fill="#eee9ff"/><text x="816" y="844" text-anchor="middle">Reactions</text>
    <rect x="884" y="817" width="91" height="43" rx="12" fill="#eee9ff"/><text x="929" y="844" text-anchor="middle">Saves</text>
    <rect x="987" y="817" width="99" height="43" rx="12" fill="#eee9ff"/><text x="1036" y="844" text-anchor="middle">Shares</text>
    <rect x="1098" y="817" width="112" height="43" rx="12" fill="#eee9ff"/><text x="1154" y="844" text-anchor="middle">Comments</text>
    <rect x="1222" y="817" width="100" height="43" rx="12" fill="#eee9ff"/><text x="1272" y="844" text-anchor="middle">Mentions</text>
  </g>
  <path d="M720 522V780" class="dashed"/>
  <text x="740" y="580" class="tiny">shared target</text>
</svg>
