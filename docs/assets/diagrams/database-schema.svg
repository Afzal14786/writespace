<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc">
<title id="title">Writespace database schema overview</title>
<desc id="desc">Conceptual diagram of the 15 current Writespace database tables, showing users, shared content items, Post and Article records, common interactions, comments, follows, notification deliveries, and interaction events.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#faf8ff"/><stop offset="1" stop-color="#eeeaff"/></linearGradient>
  <linearGradient id="core" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4c1d95"/><stop offset="1" stop-color="#6d28d9"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#34205f" flood-opacity=".12"/></filter>
  <style>
    .heading{font:700 30px Inter,Arial,sans-serif;fill:#23114d}.sub{font:500 17px Inter,Arial,sans-serif;fill:#62567f}
    .box{fill:#fff;stroke:#d8ccff;stroke-width:2;rx:18;filter:url(#shadow)}
    .corebox{fill:url(#core);stroke:#a78bfa;stroke-width:3;rx:22;filter:url(#shadow)}
    .t{font:700 20px Inter,Arial,sans-serif;fill:#29145b}.s{font:500 15px Inter,Arial,sans-serif;fill:#695d82}
    .coret{font:700 25px Inter,Arial,sans-serif;fill:#fff}.cores{font:500 16px Inter,Arial,sans-serif;fill:#ede9fe}
    .edge{fill:none;stroke:#8b72ca;stroke-width:3}.dash{stroke-dasharray:8 7}
    .group{font:700 16px Inter,Arial,sans-serif;fill:#6d28d9;letter-spacing:1px}
    .note{font:500 14px Inter,Arial,sans-serif;fill:#75698f}
  </style>
</defs>
<rect width="1600" height="1120" rx="28" fill="url(#bg)"/>
<text x="64" y="68" class="heading">Writespace · Database relationships</text>
<text x="64" y="101" class="sub">Conceptual view of the 15 tables in the current Drizzle schema</text>

<!-- Identity and content spine -->
<path class="edge" d="M800 230 V285"/>
<path class="edge" d="M800 420 V470 H495 V520"/>
<path class="edge" d="M800 470 H1105 V520"/>
<path class="edge" d="M495 605 V655 H270 V700"/>
<path class="edge" d="M800 420 V660 H800 V700"/>
<path class="edge" d="M800 660 H1330 V700"/>
<path class="edge" d="M800 420 V875 H230 V920"/>
<path class="edge" d="M360 965 H390"/>
<path class="edge dash" d="M800 230 V880 H800 V920"/>
<path class="edge" d="M800 790 V845"/>

<!-- Users -->
<rect x="625" y="140" width="350" height="90" class="box"/>
<text x="800" y="177" text-anchor="middle" class="t">users</text>
<text x="800" y="205" text-anchor="middle" class="s">Account and user identity</text>

<!-- Core content -->
<rect x="565" y="285" width="470" height="135" class="corebox"/>
<text x="800" y="343" text-anchor="middle" class="coret">content_items</text>
<text x="800" y="378" text-anchor="middle" class="cores">Shared ID · type · author · lifecycle · counters</text>

<!-- Subtypes -->
<text x="64" y="500" class="group">TYPE-SPECIFIC RECORDS</text>
<rect x="330" y="520" width="330" height="85" class="box"/>
<text x="495" y="558" text-anchor="middle" class="t">posts</text>
<text x="495" y="582" text-anchor="middle" class="s">Post-specific data</text>
<rect x="940" y="520" width="330" height="85" class="box"/>
<text x="1105" y="558" text-anchor="middle" class="t">articles</text>
<text x="1105" y="582" text-anchor="middle" class="s">Article-specific data</text>

<!-- Shared interaction group -->
<text x="64" y="680" class="group">SHARED CONTENT INTERACTIONS</text>
<rect x="100" y="700" width="340" height="90" class="box"/>
<text x="270" y="738" text-anchor="middle" class="t">post_media</text>
<text x="270" y="764" text-anchor="middle" class="s">Post-specific media records</text>
<rect x="630" y="700" width="340" height="90" class="box"/>
<text x="800" y="738" text-anchor="middle" class="t">content_reactions · saves · shares</text>
<text x="800" y="764" text-anchor="middle" class="s">Generic interactions use content_item_id</text>
<rect x="1160" y="700" width="340" height="90" class="box"/>
<text x="1330" y="738" text-anchor="middle" class="t">content_mentions</text>
<text x="1330" y="764" text-anchor="middle" class="s">Content item and mentioned user</text>

<!-- Lower group -->
<text x="64" y="900" class="group">COMMENTS, USER RELATIONSHIPS &amp; PLATFORM RECORDS</text>
<rect x="100" y="920" width="260" height="90" class="box"/>
<text x="230" y="958" text-anchor="middle" class="t">comments</text>
<text x="230" y="984" text-anchor="middle" class="s">Content comments and replies</text>
<rect x="390" y="920" width="260" height="90" class="box"/>
<text x="520" y="958" text-anchor="middle" class="t">comment_reactions</text>
<text x="520" y="984" text-anchor="middle" class="s">Reactions on comments</text>
<rect x="680" y="920" width="240" height="90" class="box"/>
<text x="800" y="958" text-anchor="middle" class="t">follows</text>
<text x="800" y="984" text-anchor="middle" class="s">User-to-user relationships</text>
<rect x="950" y="920" width="240" height="90" class="box"/>
<text x="1070" y="958" text-anchor="middle" class="t">interaction_events</text>
<text x="1070" y="984" text-anchor="middle" class="s">Interaction event records</text>
<rect x="1240" y="920" width="270" height="90" class="box"/>
<text x="1375" y="958" text-anchor="middle" class="t">notifications</text>
<text x="1375" y="984" text-anchor="middle" class="s">Notification records</text>
<path class="edge" d="M1375 1010 V1040"/>
<rect x="1240" y="1040" width="270" height="62" class="box"/>
<text x="1375" y="1078" text-anchor="middle" class="t">notification_deliveries</text>
<text x="64" y="1075" class="note">Dashed links indicate related areas; consult the Drizzle schema for exact FK columns and delete behavior.</text>
</svg>
